# Production deployment: Server + Caddy (two-port TLS), one command.
#
#   cp deploy/.env.example deploy/.env   # set WEB_HOST/AGENT_HOST/WEB_ORIGIN/AGENT_ORIGIN
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
#
# Caddy terminates TLS on both public entrances and proxies to the Server over
# the compose network. The Server itself is not published and binds 0.0.0.0 only
# inside the container (DOCKER_ENV=1 in the image).

name: oh-my-tui-prod

services:
  server:
    image: ${SERVER_IMAGE:-oh-my-tui/server:0.1.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      WEB_PORT: "8080"
      AGENT_PORT: "8443"
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in deploy/.env}
      AGENT_ORIGIN: ${AGENT_ORIGIN:?set AGENT_ORIGIN in deploy/.env}
      # Address embedded in generated enroll commands, if it differs from AGENT_ORIGIN.
      AGENT_CONNECT_HOST: ${AGENT_CONNECT_HOST:-}
      AGENT_CONNECT_PORT: ${AGENT_CONNECT_PORT:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-15}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-336}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-5}
      ENROLL_PAIRING_WINDOW_MINUTES: ${ENROLL_PAIRING_WINDOW_MINUTES:-0}
      ENROLL_RATE_LIMIT_PER_MINUTE: ${ENROLL_RATE_LIMIT_PER_MINUTE:-30}
      # The bundled Caddy is the only client on this network; trust that subnet.
      TRUST_PROXY: ${TRUST_PROXY:-172.31.238.0/24}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-20}
      LOGIN_GLOBAL_RATE_LIMIT_PER_MINUTE: ${LOGIN_GLOBAL_RATE_LIMIT_PER_MINUTE:-60}
      OFFLINE_AFTER_MS: ${OFFLINE_AFTER_MS:-45000}
    volumes:
      - server-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/bootstrap').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${SERVER_MEM_LIMIT:-1g}
    cpus: ${SERVER_CPUS:-2.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      WEB_HOST: ${WEB_HOST:-localhost}
      AGENT_HOST: ${AGENT_HOST:-localhost}
      AGENT_PORT: ${AGENT_PORT:-8443}
    ports:
      # ACME HTTP challenge (only needed for real domains; harmless otherwise).
      - "${BIND_ADDR:-0.0.0.0}:${ACME_HTTP_PORT:-80}:80"
      # Browser entrance -> WEB
      - "${BIND_ADDR:-0.0.0.0}:${WEB_PORT_PUBLISHED:-443}:443"
      # Agent entrance -> AGENT
      - "${BIND_ADDR:-0.0.0.0}:${AGENT_PORT_PUBLISHED:-8443}:${AGENT_PORT:-8443}"
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  server-data:
  caddy-data:
  caddy-config:

# Fixed subnet so TRUST_PROXY can be set precisely (Caddy is the only peer).
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.31.238.0/24}
